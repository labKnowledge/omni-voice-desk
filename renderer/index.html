<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omni Voice Desk</title>
<link rel="icon" type="image/png" href="../assets/icons/64x64.png">
<link rel="apple-touch-icon" href="../assets/icons/256x256.png">
<link rel="stylesheet" href="./styles/desktop.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* ─── Tokens ──────────────────────────────────────────────────────────── */
@property --glow-color { syntax: '<color>'; inherits: false; initial-value: transparent; }

:root {
  color-scheme: light;
  --bg: #e9ecef;
  --panel: #f2f4f6;
  --glass: rgb(249 250 251 / .72);
  --ink: #121a23;
  --ink-2: #3e4955;
  --muted: #5f6a76;
  --line: rgb(18 26 35 / .09);
  --line-2: rgb(18 26 35 / .17);
  --sheen: rgb(255 255 255 / .9);
  --focus: rgb(18 26 35 / .45);
  --record: #e5484d;
  /* State colors as RGB channels, so each can take any alpha */
  --idle: 143 162 216;
  --listen: 31 181 201;
  --think: 154 163 178;
  --speak: 240 122 142;
  --glow: .2;
  --shadow-lg: 0 1px 2px rgb(18 26 35 / .05), 0 14px 34px -14px rgb(18 26 35 / .2), 0 34px 80px -36px rgb(18 26 35 / .26);
  --shadow-sm: 0 1px 2px rgb(18 26 35 / .1), 0 6px 16px -6px rgb(18 26 35 / .22);
  --dark: 0; /* read by the script */

  --serif: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Dark follows the system unless the viewer sets data-theme. Both blocks hold the same values. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121922; --panel: #17202a; --glass: rgb(30 39 50 / .6);
    --ink: #e6ebf0; --ink-2: #aeb8c3; --muted: #7b8794;
    --line: rgb(230 235 240 / .08); --line-2: rgb(230 235 240 / .16);
    --sheen: rgb(255 255 255 / .07); --focus: rgb(230 235 240 / .5); --record: #ff6369;
    --idle: 127 146 204; --listen: 44 196 216; --think: 163 172 186; --speak: 242 125 147; --glow: .13;
    --shadow-lg: 0 18px 50px -18px rgb(0 0 0 / .65), 0 2px 6px rgb(0 0 0 / .3);
    --shadow-sm: 0 6px 18px -6px rgb(0 0 0 / .6);
    --dark: 1;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121922; --panel: #17202a; --glass: rgb(30 39 50 / .6);
  --ink: #e6ebf0; --ink-2: #aeb8c3; --muted: #7b8794;
  --line: rgb(230 235 240 / .08); --line-2: rgb(230 235 240 / .16);
  --sheen: rgb(255 255 255 / .07); --focus: rgb(230 235 240 / .5); --record: #ff6369;
  --idle: 127 146 204; --listen: 44 196 216; --think: 163 172 186; --speak: 242 125 147; --glow: .13;
  --shadow-lg: 0 18px 50px -18px rgb(0 0 0 / .65), 0 2px 6px rgb(0 0 0 / .3);
  --shadow-sm: 0 6px 18px -6px rgb(0 0 0 / .6);
  --dark: 1;
}

/* ─── Base ────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  --state: var(--idle);
}
/* Hiding wins over an element's own display */
[hidden] { display: none !important; }
body[data-state="listening"] { --state: var(--listen); }
body:is([data-state="thinking"], [data-state="failed"]) { --state: var(--think); }
body[data-state="speaking"] { --state: var(--speak); }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
kbd { padding: 2px 6px 3px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; font: 600 .9em/1 var(--sans); color: var(--ink-2); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

/* ─── Room light: the page glows in the orb's state color ─────────────── */
.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  --glow-color: rgb(var(--state) / var(--glow));
  background: radial-gradient(70vmax 55vmax at 50% var(--orb-y, 40%), var(--glow-color), transparent 70%);
  transition: --glow-color 1.6s var(--ease-in-out);
}

/* ─── Header ──────────────────────────────────────────────────────────── */
.header {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 64px;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) 0 max(22px, env(safe-area-inset-left, 0px));
}
html[data-platform="darwin"] .header {
  padding-left: max(78px, env(safe-area-inset-left, 0px));
  -webkit-app-region: drag;
}
html[data-platform="darwin"] .header-actions,
html[data-platform="darwin"] .brand-mark,
html[data-platform="darwin"] .icon-button,
html[data-platform="darwin"] .pill-button {
  -webkit-app-region: no-drag;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 7px;
  object-fit: cover;
  box-shadow: 0 1px 2px rgb(18 26 35 / .18), 0 6px 14px -8px rgb(18 26 35 / .35);
}
.brand-text { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.wordmark {
  font: italic 400 clamp(18px, 1.05rem + .5vw, 23px)/1 var(--serif);
  font-variation-settings: 'opsz' 72;
  font-variant-numeric: lining-nums;
  letter-spacing: -.005em;
  white-space: nowrap;
}
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; transform: translateY(-2px); }
.status-dot { position: relative; width: 7px; height: 7px; border-radius: 50%; color: rgb(var(--state)); background: currentColor; transition: color .6s; }
.status-dot::after { content: ''; position: absolute; inset: -5px; border: 1px solid currentColor; border-radius: 50%; opacity: 0; }
body:not([data-state="idle"], [data-state="failed"]) .status-dot::after { animation: ping 1.6s var(--ease-out) infinite; }
@keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.header-actions { display: flex; align-items: center; gap: 2px; }
.timer-pill { display: inline-flex; align-items: center; gap: 6px; margin-right: 8px; padding: 4px 11px 4px 9px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; animation: rise .5s var(--ease-out) both; }
.icon-button {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  transition: background-color .2s, color .2s, transform .3s var(--ease-out);
}
.icon-button:hover { background: var(--line); color: var(--ink); }
.icon-button:active { transform: scale(.93); }
.voice-toggle[aria-pressed="false"] .icon-on, .voice-toggle[aria-pressed="true"] .icon-off { display: none; }
.badge {
  position: absolute;
  top: 4px;
  right: 2px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--bg);
  font: 600 10px/16px var(--sans);
  font-variant-numeric: tabular-nums;
  text-align: center;
  transform: scale(0);
  transition: transform .4s var(--ease-out);
}
.badge:not(:empty) { transform: scale(1); }

/* ─── Stage: orb and caption ──────────────────────────────────────────── */
.stage {
  position: relative;
  z-index: 1;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  container-type: size;
  --orb-size: clamp(160px, min(40cqh, 62cqw), 380px);
  --orb-center: 41cqh; /* from the top of the stage to the orb's center */
  --orb-scale: 1;
}
body:not([data-empty]) .stage { --orb-center: 24cqh; --orb-scale: .68; }
.orb {
  position: relative;
  flex: none;
  width: var(--orb-size);
  height: var(--orb-size);
  /* The orb shrinks with a transform; the negative bottom margin returns the space it no longer fills */
  margin-top: max(6px, calc(var(--orb-center) - var(--orb-size) * var(--orb-scale) / 2));
  margin-bottom: calc(var(--orb-size) * (var(--orb-scale) - 1));
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  cursor: pointer;
  transform: scale(var(--orb-scale));
  transform-origin: 50% 0;
  transition: margin 1.2s var(--ease-out), transform 1.2s var(--ease-out);
}
.orb-canvas { position: absolute; top: -70%; left: -70%; width: 240%; height: 240%; pointer-events: none; }
/* A CSS sphere, shown only when WebGL is unavailable */
.orb.fallback::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  transform: scale(var(--fallback-scale, 1));
  background:
    radial-gradient(circle at 34% 28%, rgb(255 255 255 / .85), rgb(255 255 255 / 0) 34%),
    conic-gradient(from var(--fallback-angle, 0deg), rgb(var(--orb-c1)), rgb(var(--orb-c2)), rgb(var(--orb-c3)), rgb(var(--orb-c1)));
  box-shadow: 0 0 70px -10px rgb(var(--orb-c2) / .7);
  clip-path: inset(calc(100% - var(--fallback-fill, 1) * 100%) 0 0 0); /* fills from the bottom while the model loads */
}
.orb.fallback::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line-2); }
.orb:disabled { cursor: default; }

.caption {
  position: relative;
  flex: 1;
  min-height: 0;
  width: min(760px, 100% - 40px);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(18px, 4.5cqh, 40px) 0 10px;
  text-align: center;
}
.intro { position: absolute; top: clamp(18px, 4.5cqh, 40px); left: 0; right: 0; transition: opacity .6s var(--ease-out), transform .9s var(--ease-out), filter .6s; }
body:not([data-empty]) .intro { opacity: 0; transform: translateY(-16px); filter: blur(6px); pointer-events: none; }
body:is([data-state="loading"], [data-state="failed"]) .intro { opacity: 0; transform: translateY(16px); filter: blur(6px); pointer-events: none; }
/* Shown in place of the intro until the model is ready */
.loader { position: absolute; top: clamp(18px, 4.5cqh, 40px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; transition: opacity .6s var(--ease-out), transform .9s var(--ease-out), filter .6s, visibility 0s; }
body:not([data-state="loading"], [data-state="failed"]) .loader { opacity: 0; transform: translateY(-16px); filter: blur(6px); visibility: hidden; transition-delay: 0s, 0s, 0s, .6s; }
.loader-percent { font-variant-numeric: tabular-nums; }
.loader .pill-button { margin-top: 22px; }
.intro-title { margin: 0 auto; max-width: 18ch; font: 300 clamp(2rem, 1.15rem + 2.9vw, 3.3rem)/1.06 var(--serif); font-variation-settings: 'opsz' 72; letter-spacing: -.025em; text-wrap: balance; }
.intro-hint { margin: 16px auto 0; max-width: 46ch; font-size: 14px; color: var(--muted); text-wrap: balance; }
.suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px auto 0; max-width: 520px; }
.you, .tools, .reply-wrap, .meta { transition: opacity .5s; }
body[data-empty] :is(.you, .tools, .reply-wrap, .meta) { opacity: 0; }

.you { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; max-width: 100%; margin-bottom: 14px; line-height: 1.45; color: var(--muted); }
.you-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; max-width: 58ch; }
.voice-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 11px 0 10px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: transparent;
  font-size: 12px;
  color: var(--ink-2);
}
.voice-chip svg { display: block; }
.voice-chip rect { fill: currentColor; }
button.voice-chip { cursor: pointer; transition: background-color .2s; }
button.voice-chip:hover { background: var(--line); }
.voice-chip.playing { border-color: currentColor; color: rgb(var(--listen)); }

/* What the assistant looked up or did for the reply */
.tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; max-width: 100%; margin-bottom: 10px; }
.tools:empty { display: none; }
.tool-chip { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12px; color: var(--ink-2); white-space: nowrap; animation: rise .5s var(--ease-out) both; }
.tool-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--listen)); transition: background-color .4s; }
.tool-chip[data-status="running"] .tool-dot { background: rgb(var(--think)); animation: blink 1.2s ease-in-out infinite; }
.tool-chip[data-status="failed"] { border-style: dashed; color: var(--muted); }
.tool-chip[data-status="failed"] .tool-dot { background: var(--record); }
.reply-wrap { position: relative; flex: 0 1 auto; width: 100%; min-height: 0; overflow: hidden; }
/* An edge fades only while it hides part of the reply: the caption sets how much each one hides */
.reply-wrap.overflowing {
  --fade-top: min(28px, var(--hidden-top, 0px));
  --fade-bottom: min(40px, var(--hidden-bottom, 40px));
  -webkit-mask-image: linear-gradient(transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent);
  mask-image: linear-gradient(transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent);
}
.reply { margin: 0; padding: 10px 0 18px; font: 350 clamp(1.5rem, .98rem + 1.85vw, 2.45rem)/1.22 var(--serif); font-variation-settings: 'opsz' 48; letter-spacing: -.014em; overflow-wrap: break-word; }
.reply .word { display: inline-block; animation: word-in .8s var(--ease-out) backwards; transition: opacity .45s ease; }
.reply.ghost .word { opacity: .2; } /* written but not yet spoken */
.reply.ghost .word.spoken { opacity: 1; }
.reply.interrupted .word:not(.spoken) { opacity: .1; }
.reply.error { font-style: italic; color: var(--muted); }
.meta { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.meta b { font-weight: 500; color: var(--ink-2); }
@keyframes word-in { from { opacity: 0; filter: blur(12px); transform: translateY(.32em); } }
@keyframes rise { from { opacity: 0; filter: blur(4px); transform: translateY(10px); } }

/* ─── Dock: composer and hint ─────────────────────────────────────────── */
.dock {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 0 max(14px, env(safe-area-inset-right, 0px)) 16px max(14px, env(safe-area-inset-left, 0px));
  transition: opacity .8s var(--ease-out) .3s, transform 1s var(--ease-out) .3s, visibility 0s .3s;
}
body:is([data-state="loading"], [data-state="failed"]) .dock { opacity: 0; transform: translateY(14px); visibility: hidden; transition-delay: 0s; }
.composer {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  width: min(680px, 100%);
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--glass);
  box-shadow: var(--shadow-lg), inset 0 1px 0 var(--sheen);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  backdrop-filter: blur(22px) saturate(1.5);
  transition: border-color .4s, box-shadow .5s;
}
.composer:focus-within { border-color: var(--line-2); }
.composer[data-mode="record"] {
  border-color: rgb(var(--listen) / .5);
  box-shadow: var(--shadow-lg), inset 0 1px 0 var(--sheen), 0 0 0 4px rgb(var(--listen) / .12), 0 12px 50px -14px rgb(var(--listen) / .55);
}
.field { flex: 1; min-width: 0; display: flex; transition: opacity .3s, filter .3s; }
.field textarea {
  flex: 1;
  min-width: 0;
  height: 44px;
  max-height: 168px;
  padding: 10px 6px 10px 16px;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: 400 16px/24px var(--sans);
}
.field textarea::placeholder { color: var(--muted); }
.composer[data-mode="record"] .field { opacity: 0; filter: blur(4px); pointer-events: none; }
.composer:not([data-mode="record"]) .cancel { display: none; } /* shown while recording, to cancel it */
.record-bar {
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 54px;
  right: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 4px;
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
  transition: opacity .35s var(--ease-out), transform .5s var(--ease-out);
}
.composer[data-mode="record"] .record-bar { opacity: 1; transform: none; }
.record-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--record); }
.composer[data-mode="record"] .record-dot { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .3; } }
.record-time { flex: none; min-width: 34px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.wave { flex: 1; min-width: 0; height: 32px; }
.primary {
  position: relative;
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: transform .35s var(--ease-out);
}
.primary:hover { transform: scale(1.05); }
.primary:active { transform: scale(.94); }
.primary svg { position: absolute; inset: 0; margin: auto; opacity: 0; transform: scale(.5) rotate(-45deg); transition: opacity .25s, transform .45s var(--ease-out); }
.primary[data-action="talk"] .icon-talk,
.primary:is([data-action="send"], [data-action="send-recording"]) .icon-send,
.primary[data-action="stop"] .icon-stop { opacity: 1; transform: none; }
.hint { display: none !important; }
body:not([data-composer-open]) .dock {
  opacity: 0;
  transform: translateY(14px);
  visibility: hidden;
  pointer-events: none;
}
.keyboard-toggle[aria-pressed="true"] {
  color: var(--ink);
  background: var(--line);
}

/* ─── Transcript drawer ───────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgb(8 12 18 / .22); opacity: 0; pointer-events: none; transition: opacity .45s var(--ease-out); }
body[data-transcript-open] .scrim { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  z-index: 31;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  width: min(420px, 100%);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  border-left: 1px solid var(--line);
  background: var(--panel);
  transform: translateX(104%);
  visibility: hidden;
  transition: transform .6s var(--ease-out), box-shadow .6s, visibility 0s .6s;
}
body[data-transcript-open] .drawer {
  transform: none;
  visibility: visible;
  box-shadow: -30px 0 80px -40px rgb(0 0 0 / .35);
  transition: transform .6s var(--ease-out), box-shadow .6s;
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 12px 24px; border-bottom: 1px solid var(--line); }
.drawer-title { font: italic 400 25px/1 var(--serif); font-variation-settings: 'opsz' 72; }
.drawer-actions { display: flex; align-items: center; gap: 4px; }
.log { flex: 1; margin: 0; padding: 4px 24px 40px; overflow-y: auto; overscroll-behavior: contain; list-style: none; }
.log-empty { padding: 48px 8px; font: italic 300 22px/1.35 var(--serif); color: var(--muted); text-align: center; }
.turn { padding: 18px 0; border-bottom: 1px solid var(--line); }
.turn-new { animation: rise .55s var(--ease-out) both; }
.turn-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
.turn-head span { font-weight: 600; color: var(--ink-2); }
.turn-body p { margin: 0; }
.turn-user .turn-body { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; color: var(--ink-2); }
.turn-reply .turn-body p { font: 400 20px/1.32 var(--serif); font-variation-settings: 'opsz' 24; }
.turn-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.turn-tools .tool-chip { animation: none; }
.turn-actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pill-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 13px 0 11px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: transparent;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  transition: background-color .2s, color .2s;
}
.pill-button:hover { background: var(--line); color: var(--ink); }

/* ─── Overlays ────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  z-index: 50;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 74px);
  width: max-content;
  max-width: min(440px, 100% - 32px);
  padding: 10px 16px;
  border-radius: 20px;
  background: var(--ink);
  color: var(--bg);
  box-shadow: var(--shadow-sm);
  font-size: 13px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -8px);
  transition: opacity .3s, transform .5s var(--ease-out);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ─── Small screens and reduced motion ────────────────────────────────── */
@media (max-width: 560px) {
  .timer-pill { margin-right: 4px; }
  .brand { gap: 10px; }
  .brand-mark { width: 24px; height: 24px; border-radius: 6px; }
  .brand-text { gap: 10px; }
}
@media (max-width: 400px) {
  .status-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}
@media (max-height: 560px) { .hint { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .reply .word { animation: fade-in .3s ease backwards; }
  .orb, .intro, .loader, .dock, .drawer { transition-duration: .01s !important; }
  body:not([data-state="idle"], [data-state="failed"]) .status-dot::after,
  .timer-pill, .tool-chip, .turn-new, .tool-chip[data-status="running"] .tool-dot, .composer[data-mode="record"] .record-dot { animation: none; }
}
@keyframes fade-in { from { opacity: 0; } }
</style>
</head>
<body data-state="loading" data-empty>
<div class="ambient" id="ambient" aria-hidden="true"></div>

<div class="app">
  <header class="header">
    <div class="brand">
      <img class="brand-mark" id="brand-mark" src="../assets/icons/64x64.png" width="28" height="28" alt="" decoding="async" />
      <div class="brand-text">
        <span class="wordmark" id="wordmark">Omni Voice Desk</span>
        <span class="status"><span class="status-dot" aria-hidden="true"></span><span class="status-label" id="status-label">Loading</span></span>
      </div>
    </div>
    <div class="header-actions">
      <span class="timer-pill" id="timers" role="timer" title="Timer" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span></span></span>
      <button class="icon-button voice-toggle" id="voice-toggle" type="button" aria-pressed="true" aria-label="Spoken replies" title="Spoken replies">
        <svg class="icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.2 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg class="icon-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="m16 9.5 5 5m0-5-5 5"/></svg>
      </button>
      <button class="icon-button" id="transcript-button" type="button" aria-label="Transcript" title="Transcript">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
        <span class="badge" id="turn-count"></span>
      </button>
    </div>
  </header>

  <main class="stage">
    <button class="orb" id="orb" type="button" aria-label="Start talking"></button>
    <section class="caption" aria-label="Conversation">
      <div class="intro" id="intro">
        <h1 class="intro-title">Just talk. Agents build.</h1>
        <p class="intro-hint" id="intro-hint">Hands-free listening is on. I stay in conversation and delegate coding to subagents — watch their progress on the swarm board.</p>
        <div class="suggestions" id="suggestions">
          <button class="pill-button" type="button">Pick a workspace for coding.</button>
          <button class="pill-button" type="button">Refactor the auth module and add tests.</button>
          <button class="pill-button" type="button">What are my background agents doing?</button>
          <button class="pill-button" type="button">Set a timer for five minutes.</button>
        </div>
      </div>
      <div class="loader">
        <p class="intro-title" id="loader-title" aria-live="polite">Loading LFM3-Omni</p>
        <p class="intro-hint" id="loader-detail"></p>
        <button class="pill-button" id="retry" type="button" hidden>Try again</button>
      </div>
      <div class="you" id="you" hidden></div>
      <div class="tools" id="tools" role="group" aria-label="What the assistant did"></div>
      <div class="reply-wrap" id="reply-wrap"><p class="reply" id="reply"></p></div>
      <div class="meta" id="meta"></div>
    </section>
  </main>

  <footer class="dock">
    <div class="composer" id="composer" data-mode="type">
      <button class="icon-button cancel" id="cancel" type="button" aria-label="Cancel recording" title="Cancel recording">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
      <div class="field"><textarea id="input" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="send"></textarea></div>
      <div class="record-bar" aria-hidden="true">
        <span class="record-dot"></span><span class="record-time" id="record-time">0:00</span><canvas class="wave" id="wave"></canvas>
      </div>
      <button class="primary" id="primary" type="button" data-action="talk" aria-label="Talk">
        <svg class="icon-talk" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>
        <svg class="icon-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5.5M6 11l6-6 6 6"/></svg>
        <svg class="icon-stop" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2.5" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="hint" id="hint" hidden aria-hidden="true"></div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Transcript" inert>
  <div class="drawer-head">
    <span class="drawer-title">Transcript</span>
    <div class="drawer-actions">
      <button class="pill-button" id="new-conversation" type="button">New conversation</button>
      <button class="icon-button" id="close-transcript" type="button" aria-label="Close transcript">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <ol class="log" id="log"></ol>
</aside>

<div class="toast" id="toast" role="status"></div>
<div class="visually-hidden" id="live" aria-live="polite"></div>
